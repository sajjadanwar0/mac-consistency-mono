[package]
name = "mac-analyser"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "analyser"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# the A1 verdict is the verified detector's (detect_a1_verified -> detect_a1_exec, byte-identical to the Verus source)
agent-consistency-runtime = { path = "../runtime" }

[profile.release]
opt-level = 3
lto = true
